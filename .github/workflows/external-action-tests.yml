name: External action sandbox tests

on:
  pull_request:
    paths:
      - 'sandbox/external-action/**'
      - '.github/workflows/external-action-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sandbox/external-action/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox/external-action
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
